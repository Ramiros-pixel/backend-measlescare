# Konfigurasi broker Mosquitto untuk integrasi sensor MeaslesCare.
# Image: eclipse-mosquitto:2 (lihat service `mosquitto` di docker-compose.yml).

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# topik $SYS untuk healthcheck compose
sys_interval 10

listener 1883 0.0.0.0

# ============================================================================
# DEMO JARINGAN TERTUTUP: broker menerima koneksi tanpa autentikasi.
# Data ini data kesehatan - untuk produksi WAJIB mengaktifkan autentikasi:
#
#   1) buat file password:
#        docker compose exec mosquitto \
#          mosquitto_passwd -c /mosquitto/config/passwd kiosk-01
#      (tambah perangkat lain tanpa -c)
#
#   2) ubah dua baris di bawah, lalu restart:
#        docker compose restart mosquitto
#
#   3) set MQTT_USER / MQTT_PASSWORD di publisher & bridge
#      (integrasi_sensor/config.env atau environment)
# ============================================================================
allow_anonymous true
# allow_anonymous false
# password_file /mosquitto/config/passwd